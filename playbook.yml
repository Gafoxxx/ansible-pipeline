---
- name: Instalar y configurar Nginx
  hosts: nginx
  become: true
  vars:
    teclado_repo: https://github.com/Gafoxxx/Teclado.git
    teclado_version: main
  tasks:
    - name: Actualizar cache de paquetes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar Nginx y git
      apt:
        name:
          - nginx
          - git
        state: present

    - name: Iniciar servicio Nginx
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Eliminar pagina por defecto de Nginx
      file:
        path: /var/www/html/index.nginx-debian.html
        state: absent

    # Desplegar la app (Teclado) en la raiz del sitio
    - name: Desplegar Teclado en /var/www/html
      git:
        repo: "{{ teclado_repo }}"
        dest: /var/www/html
        version: "{{ teclado_version }}"
        force: yes

    - name: Cambiar propietario de /var/www/html
      file:
        path: /var/www/html
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        recurse: yes

- name: Instalación de Docker y Docker Compose en Ubuntu
  hosts: jenkins
  become: true
  vars:
    jenkins_admin_user: admin
    # Se genera la primera vez en secrets/ (no versionado) y se reutiliza despues
    jenkins_admin_password: "{{ lookup('password', playbook_dir + '/secrets/jenkins_admin_password chars=ascii_letters,digits length=24') }}"

  tasks:
    # Actualizar el cache de paquetes
    - name: Actualizar el cache de paquetes
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # Instalar dependencias para Docker
    - name: Instalar dependencias para Docker
      apt:
        name:
          - ca-certificates
          - curl

    # Agregar el repositorio oficial de Docker (con su clave GPG)
    - name: Agregar el repositorio de Docker
      deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    # Instalar Docker y el plugin de Docker Compose
    - name: Instalar Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Iniciar servicio Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    # Añadir el usuario actual al grupo de Docker
    - name: Añadir el usuario actual al grupo de Docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    # Requerido por Elasticsearch dentro de SonarQube
    - name: Establecer vm.max_map_count en el kernel
      sysctl:
        name: vm.max_map_count
        value: "262144"
        state: present
        reload: yes

    - name: Copiar docker-compose.yml
      copy:
        src: docker-compose.yml
        dest: /home/{{ ansible_user }}/docker-compose.yml
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Credenciales del admin de Jenkins para docker compose
      copy:
        dest: /home/{{ ansible_user }}/.env
        content: |
          JENKINS_ADMIN_ID={{ jenkins_admin_user }}
          JENKINS_ADMIN_PASSWORD={{ jenkins_admin_password }}
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      no_log: true

    # Imagen de Jenkins con python, node, sshpass y los plugins de plugins.txt
    - name: Copiar build de la imagen de Jenkins
      copy:
        src: jenkins/
        dest: /home/{{ ansible_user }}/jenkins/
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    # Ejecutar un archivo docker-compose.yml
    - name: Ejecutar docker-compose.yml
      command: docker compose up -d --build
      args:
        chdir: /home/{{ ansible_user }}/
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Created' in compose_up.stderr or 'Recreated' in compose_up.stderr"
